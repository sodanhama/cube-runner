<head>
    <title>Cube Runner</title>
</head>
<style>
  body {
    margin: 0;
  }
</style>

<script
  async
  src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"
></script>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three'
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

  const scene = new THREE.Scene()
  scene.background = new THREE.Color(0x34303A)
  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  )

  const renderer = new THREE.WebGLRenderer({ antialias: true })
  renderer.shadowMap.enabled = true
  renderer.setSize(window.innerWidth, window.innerHeight)
  document.body.appendChild(renderer.domElement)

  const controls = new OrbitControls(camera, renderer.domElement)

  class Box extends THREE.Mesh {
    constructor({width, height, depth, color, velocity={ x: 0, y: 0, z: 0 }, position={ x: 0, y: 0, z: 0 }, zAcceleration=false}) {
        super(new THREE.BoxGeometry(width, height, depth), new THREE.MeshStandardMaterial({ color: color }))

        this.width = width
        this.height = height
        this.depth = depth
        this.position.set(position.x, position.y, position.z)

        this.right = this.position.x + this.width/2
        this.left = this.position.x - this.width/2

        this.front = this.position.z + this.depth/2
        this.back = this.position.z - this.depth/2

        this.bottom = this.position.y - this.height/2
        this.top = this.position.y + this.height/2

        this.velocity = velocity

        this.gravity = -0.007

        this.zAcceleration = zAcceleration
        }  

        updateSides(platform) {
        this.right = this.position.x + this.width/2
        this.left = this.position.x - this.width/2

        this.front = this.position.z + this.depth/2
        this.back = this.position.z - this.depth/2

        this.bottom = this.position.y - this.height/2
        this.top = this.position.y + this.height/2
        }
      
        update(platform) {
        this.updateSides()
        if (this.zAcceleration)this.velocity.z += 0.001

        this.position.x += this.velocity.x
        this.position.z += this.velocity.z

        this.applyGravity(platform)
      }

        applyGravity(platform) {
        this.velocity.y += this.gravity

        if (boxCollision({box1: this, box2: platform})) {
          this.velocity.y *= 0.8
          this.velocity.y = -this.velocity.y}
        else
          this.position.y += this.velocity.y
        }
        }
      
  function boxCollision({box1, box2}) {

    const xCollision = box1.right>=box2.left && box1.left<=box2.right
    const yCollision = box1.bottom + box1.velocity.y <= box2.top && box1.top >= box2.bottom
    const zCollision = box1.front>=box2.back && box1.back<=box2.front
    
    return xCollision && yCollision && zCollision


  }

  const cube = new Box({width: 1, height: 1, depth: 1, color: 0xC5D1EB, velocity: { x: 0, y: -0.01, z: 0 }, position: { x: 0, y: 0, z: 0 }})
  cube.castShadow = true
  scene.add(cube)

  const platform = new Box({width: 10, height: 0.5, depth: 50, color: 0x006C67, position: { x: 0, y: -2, z: 0 }})
  platform.receiveShadow = true
  scene.add(platform)

  const light = new THREE.DirectionalLight(0xE4F8ED,0.75)
  const ambientLight = new THREE.AmbientLight(0xE4F8ED, 0.75)
  scene.add(ambientLight)
  light.position.y = 3  
  light.position.z = 2
  light.castShadow = true
  scene.add(light)

  camera.position.z = 5

  const keys = {
    a: {pressed:false},
    d: {pressed:false},
    w: {pressed:false},
    s: {pressed:false}
  }

  window.addEventListener('keydown', (event) => {
    switch(event.code) {
      case 'KeyA':
        keys.a.pressed = true
        break
      case 'KeyD':
        keys.d.pressed = true
        break
      case 'KeyW':
        keys.w.pressed = true
        break
      case 'KeyS':
        keys.s.pressed = true
        break
    }
  })

  window.addEventListener('keyup', (event) => {
    switch(event.code) {
      case 'KeyA':
        keys.a.pressed = false
        break
      case 'KeyD':
        keys.d.pressed = false
        break
      case 'KeyW':
        keys.w.pressed = false
        break
      case 'KeyS':
        keys.s.pressed = false
        break
    }
  })

  const enemies = []
  

  let frames = 0
  let spawnrate = 200
  function animate() {
    const animationID = requestAnimationFrame(animate)
    renderer.setPixelRatio(window.devicePixelRatio);

    renderer.render(scene, camera)
    cube.velocity.x = 0
    cube.velocity.z = 0
    if (keys.a.pressed)cube.velocity.x = -0.03
    else if (keys.d.pressed)cube.velocity.x = 0.03
    if (keys.w.pressed)cube.velocity.z = -0.03
    else if (keys.s.pressed)cube.velocity.z = 0.03

    enemies.forEach(enemy => {
      enemy.update(platform)
      if (boxCollision({box1:cube,box2:enemy})) {
        window.cancelAnimationFrame(animationID)
        if (confirm('Game over! Play Again?')) {
          window.location.reload()
        }
      }
    })

    if (frames % spawnrate === 0) {
      if (spawnrate > 20) spawnrate -= 20
      const enemy = new Box({width: 1, height: 1, depth: 1, color: 0xB6465F, velocity: { x: 0, y: 0, z: 0.01 }, position: { x: (Math.random() -0.5) * 5, y: 0, z: -20 }, zAcceleration: true  })
      enemy.castShadow = true
      scene.add(enemy)
      enemies.push(enemy)
    }

    frames++
    cube.update(platform)
  }
  animate()
</script>
