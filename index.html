<head>
    <title>Cube Runner</title>
</head>
<style>
  body {
    margin: 0;
  }
</style>

<script
  async
  src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"
></script>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three'
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

  const scene = new THREE.Scene()
  scene.background = new THREE.Color(0x34303A)
  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  )

  const renderer = new THREE.WebGLRenderer()
  renderer.shadowMap.enabled = true
  renderer.setSize(window.innerWidth, window.innerHeight)
  document.body.appendChild(renderer.domElement)

  const controls = new OrbitControls(camera, renderer.domElement)

  class Box extends THREE.Mesh {
    constructor({width, height, depth, color, velocity={ x: 0, y: 0, z: 0 }, position={ x: 0, y: 0, z: 0 }}) {
        super(new THREE.BoxGeometry(width, height, depth), new THREE.MeshStandardMaterial({ color: color }))

        this.width = width
        this.height = height
        this.depth = depth
        this.position.set(position.x, position.y, position.z)
        this.bottom = this.position.y - this.height/2
        this.top = this.position.y + this.height/2

        this.velocity = velocity

        this.gravity = -0.007
        }  
      
        update(platform) {
        this.bottom = this.position.y - this.height/2
        this.top = this.position.y + this.height/2

        
        this.position.x += this.velocity.x
        this.position.z += this.velocity.z
        this.applyGravity()}

        applyGravity() {
        this.velocity.y += this.gravity

        if (this.bottom + this.velocity.y <= platform.top) {
          this.velocity.y *= 0.8
          this.velocity.y = -this.velocity.y}
        else
          this.position.y += this.velocity.y
        }
        }
      

  const cube = new Box({width: 1, height: 1, depth: 1, color: 0xC5D1EB, velocity: { x: 0, y: -0.01, z: 0 }, position: { x: 0, y: 0, z: 0 }})
  cube.castShadow = true
  scene.add(cube)

  const platform = new Box({width: 5, height: 0.5, depth: 10, color: 0x006C67, position: { x: 0, y: -2, z: 0 }})
  platform.receiveShadow = true
  scene.add(platform)

  const light = new THREE.DirectionalLight(0xE4F8ED,0.5)
  const ambientLight = new THREE.AmbientLight(0xE4F8ED, 0.5)
  scene.add(ambientLight)
  light.position.y = 3  
  light.position.z = 2
  light.castShadow = true
  scene.add(light)

  camera.position.z = 5

  const keys = {
    a: {pressed:false},
    d: {pressed:false},
    w: {pressed:false},
    s: {pressed:false}
  }

  window.addEventListener('keydown', (event) => {
    switch(event.code) {
      case 'KeyA':
        keys.a.pressed = true
        break
      case 'KeyD':
        keys.d.pressed = true
        break
      case 'KeyW':
        keys.w.pressed = true
        break
      case 'KeyS':
        keys.s.pressed = true
        break
    }
  })

  window.addEventListener('keyup', (event) => {
    switch(event.code) {
      case 'KeyA':
        keys.a.pressed = false
        break
      case 'KeyD':
        keys.d.pressed = false
        break
      case 'KeyW':
        keys.w.pressed = false
        break
      case 'KeyS':
        keys.s.pressed = false
        break
    }
  })

  function animate() {
    requestAnimationFrame(animate)
    renderer.render(scene, camera)
    cube.velocity.x = 0
    cube.velocity.z = 0
    if (keys.a.pressed)cube.velocity.x = -0.02
    else if (keys.d.pressed)cube.velocity.x = 0.02
    else if (keys.w.pressed)cube.velocity.z = -0.02
    else if (keys.s.pressed)cube.velocity.z = 0.02
    cube.update(platform)
  }
  animate()
</script>
